name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: mydb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --workspaces --if-present
      - run: npm run build --workspaces --if-present
      - name: Backend tests
        working-directory: backend
        env:
          JWT_SECRET: test_secret_32_chars_minimum_length_!
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: admin
          DB_PASSWORD: admin
          DB_NAME: mydb
        run: npm test -- --passWithNoTests
      - name: Docker build smoke
        run: |
          docker build -f backend/Dockerfile -t traffic-backend:ci ./backend
          docker build -f frontend/Dockerfile -t traffic-frontend:ci ./frontend

